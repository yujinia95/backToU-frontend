<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackToU: Sign up</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand auth-brand">BackTo<span>U</span></a>
    <h1>Create your account</h1>
    <p class="auth-sub">Post items and get matched.</p>

    <div class="alert alert-error" data-form-alert role="alert"></div>

    <form id="signup-form" novalidate>
      <div class="field-row">
        <div class="field" data-field="first_name">
          <label for="first_name">First name</label>
          <input type="text" id="first_name" name="first_name" placeholder="Jordan" autocomplete="given-name" required>
          <p class="error">Enter your first name.</p>
        </div>
        <div class="field" data-field="last_name">
          <label for="last_name">Last name</label>
          <input type="text" id="last_name" name="last_name" placeholder="Ellis" autocomplete="family-name" required>
          <p class="error">Enter your last name.</p>
        </div>
      </div>

      <div class="field" data-field="email">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <p class="error">Enter a valid email address.</p>
      </div>

      <div class="field" data-field="password">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
        <p class="hint">Use 8 characters or more.</p>
        <p class="error">Password must be at least 8 characters.</p>
      </div>

      <div class="field" data-field="confirm">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" required>
        <p class="error">Passwords don't match.</p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <span data-btn-label>Create account</span>
      </button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/models.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
