<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BackToU: Log in</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand auth-brand">BackTo<span>U</span></a>
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to check your matches and post new items.</p>

    <div class="alert alert-error" data-form-alert role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field" data-field="email">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <p class="error">Enter a valid email address.</p>
      </div>

      <div class="field" data-field="password">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="current-password" required>
        <p class="error">Password must be at least 8 characters.</p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <span data-btn-label>Log in</span>
      </button>
    </form>

    <p class="auth-switch">New to BackToU? <a href="signup.html">Create an account</a></p>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/models.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
